<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta charset="UTF-8">

        <!-- HTML Meta Tags -->
        <title>Badges 4 README Profile</title>
        <meta name="description" content="Improve your README.md profile with these amazing badges.">

        <!-- Google / Search Engine Tags -->
        <meta itemprop="name" content="Badges 4 README Profile">
        <meta itemprop="description" content="Improve your README.md profile with these amazing badges.">
        <meta itemprop="image" content="https://alexandresanlim.github.io/Badges4-README.md-Profile/media/cover.png">

        <!-- Facebook Meta Tags -->
        <meta property="og:url" content="https://alexandresanlim.github.io/Badges4-README.md-Profile/">
        <meta property="og:type" content="website">
        <meta property="og:title" content="Badges 4 README Profile">
        <meta property="og:description" content="Improve your README.md profile with these amazing badges.">
        <meta property="og:image" content="https://alexandresanlim.github.io/Badges4-README.md-Profile/media/cover.png">

        <!-- Twitter Meta Tags -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Badges 4 README Profile">
        <meta name="twitter:description" content="Improve your README.md profile with these amazing badges.">
        <meta name="twitter:image" content="https://alexandresanlim.github.io/Badges4-README.md-Profile/media/cover.png">

        <!-- Favicon -->
        <link rel="shortcut icon" href="favicon.ico">

        <!-- Stylesheets -->
        <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
        <link rel="stylesheet" media="(prefers-color-scheme: dark)" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css">
    </head>

    <body>
        <noscript>This page requires JavaScript to work, please enable it or read the list <a href="https://github.com/alexandresanlim/Badges4-README.md-Profile#readme">here</a>.</noscript>

        <div id="app">Loading...</div>

        <script>
            window.$docsify = {
                name: "Badges 4 README Profile",
                repo: "alexandresanlim/Badges4-README.md-Profile",
                search: ["/"],
                alias: {
                    "/": "https://raw.githubusercontent.com/alexandresanlim/Badges4-README.md-Profile/master/README.md"
                }
            }
        </script>

        <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
        <script>//Search improvement, when the user clicks into a result it goes direct to it instead to the category
            window.addEventListener('DOMContentLoaded',async () => {

                do{
                    await new Promise((resolve) => setTimeout(resolve, 100));
                }while(!document.querySelectorAll('td').length);

                // Assign searchable IDs to table rows based on badge text
                const tableCells = document.querySelectorAll('td');
                tableCells.forEach((cell) => {
                    const { result1, result2 } = testText(cell.innerText);
                    if(result1 && result1[1]){
                        cell.closest('tr').id = "searchable_" + result1[1].toLowerCase().replace(/%20| /g, "");
                    } else if(result2 && result2[1]){
                        cell.closest('tr').id = "searchable_" + result2[1].toLowerCase().replace(/%20| /g, "");
                    }
                });

                //Handles search input updates
                const searchInput = document.querySelector('input[type="search"]');
                searchInput.addEventListener('input', async (event) => {
                    await new Promise((resolve) => setTimeout(resolve, 100));
                    document.querySelectorAll('p.content.clamp-2').forEach((searchResult) => {
                        const { result1, result2 } = testText(searchResult.innerText);

                        //Handles click event to update hash
                        searchResult.addEventListener("click", async () => {   
                            await new Promise((resolve) => setTimeout(resolve, 100));
                            if (result1 && result1[1]){
                                window.location.hash = "?id=searchable_" + result1[1].toLowerCase().replace(/%20| /g, "");
                            } else if (result2 && result2[1]){
                                window.location.hash = "?id=searchable_" + result2[1].toLowerCase().replace(/%20| /g, "");
                            }
                        });
                    })
                });
            });

            function testText(text){
                const regex1 = /badge\/(.*?)-/;
                const regex2 = /&logo=(.*?)&logoColor=/;
                const result1 = text.match(regex1);
                const result2 = text.match(regex2);
                return { result1, result2 };
            }
        </script>
    </body>
</html>
